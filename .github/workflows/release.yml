name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build and Package
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact_name: win-x64
            binary_name: smoc.exe
            ext: zip
          - os: ubuntu-latest
            rid: linux-x64
            artifact_name: linux-x64
            binary_name: smoc
            ext: tar.gz
          - os: macos-latest
            rid: osx-arm64
            artifact_name: mac-arm64
            binary_name: smoc
            ext: zip

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Publish
      run: |
        dotnet publish smoc/smoc.csproj -c Release -r ${{ matrix.rid }} -p:PublishSingleFile=true -p:SelfContained=true --output ./publish

    - name: Package
      shell: bash
      run: |
        # Use tag name or 'manual' if triggered by dispatch
        VERSION=${GITHUB_REF_NAME#v}
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          VERSION="manual"
        fi
        
        PACKAGE_NAME="smoc-v${VERSION}-${{ matrix.artifact_name }}-bin"
        mkdir -p dist
        
        # Include license and readme in the package
        cp LICENSE ./publish/
        cp README.md ./publish/
        
        if [[ "${{ matrix.ext }}" == "zip" ]]; then
          cd publish && zip -r ../dist/${PACKAGE_NAME}.zip .
        else
          cd publish && tar -czvf ../dist/${PACKAGE_NAME}.tar.gz .
        fi

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts
        merge-multiple: true

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: ./artifacts/*
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
