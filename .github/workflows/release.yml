name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  build:
    name: Build
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact_name: win-x64
          - os: ubuntu-latest
            rid: linux-x64
            artifact_name: linux-x64
          - os: macos-latest
            rid: osx-arm64
            artifact_name: mac-arm64

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Publish
      run: |
        dotnet publish smoc/smoc.csproj -c Release -r ${{ matrix.rid }} -p:PublishSingleFile=true -p:SelfContained=true --output ./publish

    - name: Prepare Artifact
      shell: bash
      run: |
        cp LICENSE ./publish/
        cp README.md ./publish/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ./publish/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts

    - name: Package for Release
      run: |
        # Use tag name or 'manual' if triggered by dispatch
        VERSION=${GITHUB_REF_NAME#v}
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          VERSION="manual"
        fi
        mkdir dist
        
        # Package Linux (tar.gz)
        cd artifacts/linux-x64 && tar -czvf ../../dist/smoc-v${VERSION}-linux-x64-bin.tar.gz . && cd ../..
        
        # Package Windows (zip)
        cd artifacts/win-x64 && zip -r ../../dist/smoc-v${VERSION}-win-x64-bin.zip . && cd ../..
        
        # Package MacOS (zip)
        cd artifacts/mac-arm64 && zip -r ../../dist/smoc-v${VERSION}-mac-arm64-bin.zip . && cd ../..

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
